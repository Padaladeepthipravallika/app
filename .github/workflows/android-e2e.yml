name: Android Appium Mobile E2E (1,111 Tests) & CI Emulator Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-e2e:
    name: Build APK & Run 1,111 Appium E2E Tests on Android Emulator
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable KVM Hardware Acceleration
        run: |
          echo "Setting up KVM permissions for Android Emulator hardware acceleration..."
          sudo chmod 777 /dev/kvm || true

      - name: Build Android Debug APK
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon

      - name: Install Appium & NPM Dependencies
        run: |
          npm install -g appium
          appium driver install uiautomator2 || true
          if [ -d "BrainBattleAppium" ]; then
            cd BrainBattleAppium
            npm install
          fi

      - name: Execute 1,111 Appium Tests on Android Emulator (API 29 Nexus 6)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            chmod +x BrainBattleAppium/scripts/ci_run_tests.sh
            ./BrainBattleAppium/scripts/ci_run_tests.sh

      - name: Upload Excel & HTML Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BrainBattle_Android_Appium_E2E_Reports
          path: |
            BrainBattleAppium/reports/*.xlsx
            BrainBattleAppium/reports/*.html
          retention-days: 90

      - name: Prepare GH-Pages Deployment Folder
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/reports/latest
          mkdir -p public/reports/history/build-${{ github.run_number }}
          cp -r BrainBattleAppium/reports/* public/reports/latest/ || true
          cp -r BrainBattleAppium/reports/* public/reports/history/build-${{ github.run_number }}/ || true

      - name: Deploy Reports to GitHub Pages (gh-pages)
        if: always() && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
          branch: gh-pages
