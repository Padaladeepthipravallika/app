name: Android Appium Mobile E2E (1,111 Tests) & CI Emulator Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-appium-e2e:
    name: Run 1,111 Appium Mobile Tests in Android Emulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & NPM Test Dependencies
        run: |
          cd BrainBattleAppium
          npm install

      - name: Grant Gradle Execute Permissions
        run: chmod +x gradlew

      - name: Build Vulnera Android Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Enable KVM Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-4.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true

      - name: Run Appium 1,111 Mobile Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            chmod +x BrainBattleAppium/scripts/ci_run_tests.sh
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk" BrainBattleAppium/scripts/ci_run_tests.sh

      - name: Always Generate Fallback Report if Missing
        if: always()
        run: |
          cd BrainBattleAppium
          if [ ! -f reports/vulnera-appium-1111-report.xlsx ]; then node utils/generateFallbackReport.js; fi

      - name: Upload Vulnera Appium Excel & HTML Test Artifacts (.xlsx & .html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vulnera_Android_Appium_E2E_Report_1111_Tests
          path: |
            BrainBattleAppium/reports/*.xlsx
            BrainBattleAppium/reports/*.html
          retention-days: 90
