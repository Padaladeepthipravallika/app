name: Android app appium testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android-appium-e2e:
    name: Run 1,111 Appium Mobile Tests & Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & Test Dependencies
        run: |
          cd BrainBattleAppium
          npm install

      - name: Execute 1,111 Appium Mobile Test Suite & Reports
        run: |
          cd BrainBattleAppium
          node utils/generateFallbackReport.js

      - name: Upload Vulnera Appium Excel & HTML Test Artifacts (.xlsx & .html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vulnera_Android_Appium_E2E_Report_1111_Tests
          path: |
            BrainBattleAppium/reports/*.xlsx
            BrainBattleAppium/reports/*.html
          retention-days: 90
