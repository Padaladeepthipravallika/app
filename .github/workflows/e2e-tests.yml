name: Selenium E2E Automated Test Suite & Excel Report (300+ Test Cases)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'web_app/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'web_app/**'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

jobs:
  e2e-tests:
    name: Run 300+ Selenium E2E Tests & Generate Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web_app/tests/requirements.txt

      - name: Execute 300+ Selenium E2E Test Suite
        run: |
          python web_app/tests/run_e2e_tests.py --headless

      - name: Upload Excel Test Report Artifact (.xlsx)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Selenium_E2E_Test_Report_300_Vulnera_HydrogelScan
          path: web_app/reports/*.xlsx
          retention-days: 90
